version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - CACHE_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      # Pass through external secrets
      - SPACETRACK_USER=${SPACETRACK_USER:-}
      - SPACETRACK_PASS=${SPACETRACK_PASS:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - redis
    volumes:
      - ./server:/app

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  redis_data:
